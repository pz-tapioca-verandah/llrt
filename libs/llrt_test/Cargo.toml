[package]
name = "llrt_test"
description = "LLRT test helpers"
version = "0.5.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[lib]
name = "llrt_test"
path = "src/lib.rs"

[dependencies]
nanoid = "0.4.0"
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", rev = "3394aa3128dc2d8e73c6fc8bb064a9d48c0680ff", features = [
  "futures",
  "parallel",
  "loader",
], default-features = false }
rand = "0.8.5"
tokio = { version = "1", features = ["full"] }
