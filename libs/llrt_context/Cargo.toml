[package]
name = "llrt_context"
description = "LLRT context helpers"
version = "0.5.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"

[dependencies]
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", rev = "3394aa3128dc2d8e73c6fc8bb064a9d48c0680ff", features = [
  "futures",
], default-features = false }
llrt_utils = { version = "0.5.1-beta", path = "../llrt_utils", default-features = false }
tokio = { version = "1", features = ["sync"], default-features = false }
tracing = "0.1"

[dev-dependencies]
llrt_test = { version = "0.5.1-beta", path = "../llrt_test" }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
llrt_build = { version = "0.5.1-beta", path = "../llrt_build" }
