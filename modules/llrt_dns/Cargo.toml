[package]
name = "llrt_dns"
description = "LLRT Module dns"
version = "0.5.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/llrt"
readme = "README.md"

[lib]
name = "llrt_dns"
path = "src/lib.rs"

[dependencies]
llrt_context = { version = "0.5.1-beta", path = "../../libs/llrt_context" }
llrt_dns_cache = { version = "0.5.1-beta", path = "../../libs/llrt_dns_cache" }
llrt_utils = { version = "0.5.1-beta", path = "../../libs/llrt_utils", default-features = false }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", rev = "3394aa3128dc2d8e73c6fc8bb064a9d48c0680ff", features = [
  "macro",
], default-features = false }
